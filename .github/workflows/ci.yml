name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mm
          POSTGRES_PASSWORD: mm
          POSTGRES_DB: mm_marketing
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mm:mm@localhost:5432/mm_marketing?schema=public
      TEST_DATABASE_URL: postgresql://mm:mm@localhost:5432/mm_marketing_test?schema=public
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-only-app-secret-0123456789abcdef0123456789
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      STORAGE_DRIVER: memory
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
