# Infrastructure only: PostgreSQL, Redis, S3-compatible object storage.
# Used on dev machines and on the production server (the app runs under systemd).
# All ports are bound to 127.0.0.1 — nothing is exposed to the internet.
#
#   npm run infra:up
#   npm run infra:logs
#
# Storage: Versity S3 Gateway (Apache-2.0, POSIX backend). MinIO images are no
# longer publicly pullable. The app creates its bucket on first use.

name: mm-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: mm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-mm_marketing}
      TZ: Asia/Jerusalem
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm} -d ${POSTGRES_DB:-mm_marketing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: versity/versitygw:latest
    container_name: mm-storage
    restart: unless-stopped
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-mm-storage}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:-change-me-storage-secret}
    ports:
      - "127.0.0.1:9000:7070"
    volumes:
      - storage_data:/data
    healthcheck:
      # Any HTTP response (403 for anonymous) means the gateway is up.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  storage_data:
